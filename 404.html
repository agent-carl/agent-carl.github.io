<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f7f7f4; --text: #17181a; --muted: #5a5e66; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121314; --text: #ececea; --muted: #a3a7ad; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 20px; }
    p { color: var(--muted); }
    a { color: inherit; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <a href="/">Go to the home page</a>
  </main>
</body>
</html>
